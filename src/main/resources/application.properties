spring.application.name=sns
# 秘密の値(Google ログイン・メール送信の設定など)は、リポジトリの一番上の .env に書く(git に入れない)。
# 見本は .env.example。.env がなくても起動できる(そのときは Google ログインが無効になる)
spring.config.import=optional:file:.env[.properties]

# このPCからだけ接続できるようにする。公開用(Docker のコンテナの中)では、環境変数 SERVER_ADDRESS=0.0.0.0 で切り替える
server.address=${SERVER_ADDRESS:127.0.0.1}

# データベース(compose.yaml の sns-db。5432番は taskboard が使っているので 5433番)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sns}
spring.datasource.username=${DB_USERNAME:sns}
spring.datasource.password=${DB_PASSWORD:sns}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ログイン状態(セッション)はデータベースに保存する(サーバーを再起動してもログインが続く)
spring.session.jdbc.initialize-schema=always
# 最後の操作から 30 日で切れる
server.servlet.session.timeout=30d
# Cookie: 画面のプログラムから読めない(HttpOnly)、他のサイトからの送信には付きにくい(SameSite=Lax)。
# 公開時(HTTPS)は環境変数 COOKIE_SECURE=true で、HTTPS のときだけ送る(Secure)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.max-age=30d

# メール送信。開発中は Mailpit(compose.yaml の sns-mail)が受け取り、http://localhost:8025 で見られる
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
sns.mail.from=${MAIL_FROM:no-reply@sns.local}
# メールの中のリンクに使う、アプリの URL(開発中は Vite の開発サーバー)
sns.base-url=${APP_BASE_URL:http://localhost:5173}

# Google ログイン。両方が設定されているときだけ有効になる
sns.google.client-id=${GOOGLE_CLIENT_ID:}
sns.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# 画像の保存先(git に入れない)。公開時は Docker のボリュームを指す
sns.upload-dir=${UPLOAD_DIR:uploads}
# 画像は 1 枚 5MB まで、1 投稿 10 枚まで(本文などを足した 1 回の送信は 60MB まで)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB

# サーバーのログを logs/ に保存する(10MB ごとに切り替え、30日分を残す)
logging.file.name=logs/sns.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

spring.application.name=sns
# 秘密の値(Google ログイン・メール送信の設定など)は、リポジトリの一番上の .env に書く(git に入れない)。
# 見本は .env.example。.env がなくても起動できる(そのときは Google ログインが無効になる)
spring.config.import=optional:file:.env[.properties]

# このPCからだけ接続できるようにする。公開用(Docker のコンテナの中)では、環境変数 SERVER_ADDRESS=0.0.0.0 で切り替える
server.address=${SERVER_ADDRESS:127.0.0.1}

# データベース(compose.yaml の sns-db。5432番は taskboard が使っているので 5433番)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sns}
spring.datasource.username=${DB_USERNAME:sns}
spring.datasource.password=${DB_PASSWORD:sns}
# テーブルは Flyway が作る・変える(src/main/resources/db/migration の V1__〜.sql から番号の順に、まだ流していないものだけ)。
# Hibernate はテーブルを変えず、コードとテーブルが合っているかだけ確かめる(合わなければ起動しない)
spring.jpa.hibernate.ddl-auto=validate
# Flyway を入れる前からテーブルがある DB(開発用・本番)は、「V1 まで済み」として扱い、V1 は流さない。
# 説明(baseline-description)は英語にする(.properties の値の日本語は文字化けするため)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Before Flyway (same as V1)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ログイン状態(セッション)はデータベースに保存する(サーバーを再起動してもログインが続く)
spring.session.jdbc.initialize-schema=always
# 最後の操作から 30 日で切れる
server.servlet.session.timeout=30d
# Cookie: 画面のプログラムから読めない(HttpOnly)、他のサイトからの送信には付きにくい(SameSite=Lax)。
# 公開時(HTTPS)は環境変数 COOKIE_SECURE=true で、HTTPS のときだけ送る(Secure)
# 公開用(リバースプロキシの後ろ)では FORWARD_HEADERS_STRATEGY=framework で、プロキシが付けるヘッダーを信じる(https の URL を正しく組み立てる)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.max-age=30d

# メール送信。開発中は Mailpit(compose.yaml の sns-mail)が受け取り、http://localhost:8025 で見られる
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
# 公開用(Gmail など): ログイン(認証)と暗号化(STARTTLS)を使う。開発中の Mailpit では使わない
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
# メールのサーバーが応答しないとき、いつまでも待たない(10 秒)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
sns.mail.from=${MAIL_FROM:no-reply@sns.local}
# メールの中のリンクに使う、アプリの URL(開発中は Vite の開発サーバー)
sns.base-url=${APP_BASE_URL:http://localhost:5173}

# Google ログイン。両方が設定されているときだけ有効になる
sns.google.client-id=${GOOGLE_CLIENT_ID:}
sns.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# 画像の置き場所。local(初期値): サーバーのフォルダ sns.upload-dir(git に入れない)/ s3: Amazon S3 のバケット
sns.storage.type=${STORAGE_TYPE:local}
# S3 を使うとき: バケット名とリージョン。認証は EC2 の IAM ロール(アクセスキーは書かない)
sns.storage.s3.bucket=${S3_BUCKET:}
sns.storage.s3.region=${AWS_REGION:ap-northeast-1}
# 手元で S3 の代わりの S3Mock などを使うときだけ: 接続先とキー
sns.storage.s3.endpoint=${S3_ENDPOINT:}
sns.storage.s3.access-key=${S3_ACCESS_KEY:}
sns.storage.s3.secret-key=${S3_SECRET_KEY:}
# 画像を置くフォルダ(sns.storage.type=local のとき)
sns.upload-dir=${UPLOAD_DIR:uploads}
# 画像は 1 枚 5MB まで、1 投稿 10 枚まで(本文などを足した 1 回の送信は 60MB まで)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB

# サーバーのログを logs/ に保存する(10MB ごとに切り替え、30日分を残す)
logging.file.name=logs/sns.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# API 仕様書(OpenAPI)と Swagger UI。http://localhost:8080/swagger-ui.html で開ける(ログイン不要。公開側も同じ)。
# 非常用のスイッチ: 環境変数 API_DOCS_ENABLED=false で、どちらも止められる(メモリが足りないときなど)
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.paths-to-match=/api/**,/media/**
# 返す JSON の種類を「*/*」ではなく application/json と書く
springdoc.default-produces-media-type=application/json
# 「Try it out」で、Cookie XSRF-TOKEN の値を、ヘッダー X-XSRF-TOKEN に自動で入れる(ログイン済みの POST/PUT/DELETE を試すため)
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.default-models-expand-depth=1
# 本文の説明は日本語。操作の画面は英語のまま(Swagger UI の画面自体の言語は選べない)

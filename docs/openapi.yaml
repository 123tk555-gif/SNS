openapi: 3.1.0
info:
  title: Leafline API 仕様書
  description: |
    Leafline(SNS タイムラインアプリ)の API 仕様書です。詳しい仕様(処理の流れ・データの定義・権限)は
    [機能定義書](https://github.com/123tk555-gif/SNS/blob/main/docs/機能定義書.md)にあります。

    ## 試し方(「Try it out」)
    1. **アプリでログインする。** この画面と同じアドレスでアプリを開き、ログインしておきます(ログイン状態は Cookie `SESSION` で、ブラウザが自動で付けます)。
    2. この画面で、試したい API の「Try it out」→「Execute」を押します。
    3. データを変える API(POST・PUT・DELETE)に必要な CSRF のヘッダー `X-XSRF-TOKEN` は、この画面が Cookie `XSRF-TOKEN` から自動で付けます。

    ## 共通のルール
    - データは JSON でやり取りします(画像を送るときだけ `multipart/form-data`)。日時は ISO 8601 の UTC です。
    - **エラー**は、ステータスコードと `{ "message": "画面にそのまま出せる日本語", "errors": [ { "field": "text", "message": "…" } ] }` の形で返します(`errors` は入力チェックのときだけ中身が入ります)。
    - **一覧の続きの読み込み(カーソル方式)**: 新しい順の一覧は、前の結果の `nextCursor` を `before` に渡して続きを取ります(`nextCursor` が `null` なら、それ以上はありません)。返信のように古い順の一覧は `after` を使います。`limit` は 1〜50、省略すると 20 件です。
    - **見えない投稿**: 削除・非表示の投稿、利用停止中のユーザーの投稿、ブロックの関係にある人の投稿は、一覧に出ません。ミュートした人の投稿は、一覧から除きます(その人のプロフィールと投稿詳細では見られます)。
    - ステータスコード: 200 成功 / 201 作成 / 204 成功(本文なし) / 400 入力が正しくない / 401 ログインしていない / 403 権限がない・CSRF の値が違う / 404 見つからない / 409 重複 / 413 大きすぎる / 423 ログインのロック中 / 429 回数が多すぎる
  version: "1.0"
servers:
- url: /
  description: このサーバー
security:
- sessionCookie: []
tags:
- name: アカウント
  description: 登録・ログイン・ログアウト・パスワードの再設定・初期設定。ログイン不要のものと、ログイン中の自分の情報を返すものがある(機能定義書 3.1)
- name: ユーザー
  description: プロフィール・フォロー・ブロック・ミュート(機能定義書 3.2、3.6、3.11)
- name: プロフィール編集
  description: 自分の表示名・自己紹介・アイコン画像・ヘッダー画像の変更(機能定義書 3.2)
- name: 投稿・タイムライン
  description: 投稿・返信の作成、編集、削除、タイムライン(機能定義書 3.3、3.5)
- name: いいね・ブックマーク
  description: いいね・ブックマーク(機能定義書 3.4)
- name: 通知
  description: 通知の一覧・未読の数・既読(機能定義書 3.7)
- name: 検索・トレンド
  description: 投稿・ユーザー・ハッシュタグの検索、トレンド(機能定義書 3.9、3.10)
- name: リアルタイム配信(SSE)
  description: "新着の投稿・通知を、再読み込みなしで届ける(Server-Sent Events。機能定義書 3.8)。送られるイベント: `post-created`(新\
    しい投稿)、`post-deleted`(削除・非表示された投稿の ID)、`notification`(新しい通知と未読の数)。接続の維持のため、30 秒\
    ごとに中身のない合図(コメント行)も送る"
- name: 画像
  description: 投稿・アイコン・ヘッダーの画像の配信。ログイン中の人だけが取れる
- name: 管理者(ユーザー)
  description: 管理者だけが使える。管理者以外が呼ぶと、存在しない URL と同じ 404 を返す(機能定義書 3.12)
- name: 管理者(投稿)
  description: 管理者だけが使える。管理者以外が呼ぶと、存在しない URL と同じ 404 を返す(機能定義書 3.12)
paths:
  /api/admin/posts:
    get:
      tags:
      - 管理者(投稿)
      summary: 投稿の一覧・検索
      description: 投稿の本文を、部分一致で探す(`q` を省くと全部。`%` と `_` はふつうの文字として探す)。新しい順に 50 件ずつ。非表示の投稿と、利用停止中のユーザーの投稿も含め、それぞれ印(`hidden`・`authorSuspended`)を付ける。削除済みの投稿は含めない
      operationId: list
      parameters:
      - name: q
        in: query
        description: 検索する言葉(本文)。省略すると全部
        required: false
        schema:
          type: string
          default: ""
        example: カフェ
      - name: page
        in: query
        description: ページ番号(0 から)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      responses:
        "200":
          description: 投稿の一覧(ページ番号の方式)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPostPage"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 管理者以外が呼んだ(存在しない URL と同じ応答)・対象が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/posts/{id}/visibility:
    put:
      tags:
      - 管理者(投稿)
      summary: 投稿の非表示・表示に戻す
      description: 非表示にすると、投稿者以外には見えなくなり、リアルタイム配信(`post-deleted`)で、開いている画面から消える。投稿者本人には、自分のプロフィールの投稿一覧にだけ「管理者により非表示になりました」の印つきで出る。操作は、いつ・誰が・何をしたかをログに残す
      operationId: visibility
      parameters:
      - name: id
        in: path
        description: 投稿の ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1234
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisibilityRequest"
        required: true
      responses:
        "200":
          description: 変えた。更新後の投稿(管理者向けの形)を返す
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPost"
        "400":
          description: '`hidden` がない'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 投稿が見つからない・削除済み(管理者以外が呼んだときも 404)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 権限がない、または CSRF の値(ヘッダー `X-XSRF-TOKEN`)がない・違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/users:
    get:
      tags:
      - 管理者(ユーザー)
      summary: ユーザーの一覧・検索
      description: ユーザーID・表示名・メールアドレスの部分一致で探す(`q` を省くと全員)。登録の新しい順に 50 件ずつ。管理者にするには、データベースで
        `users.role` を `ADMIN` に変える(画面や API からはできない)
      operationId: list_1
      parameters:
      - name: q
        in: query
        description: 検索する言葉(ユーザーID・表示名・メールアドレス)。省略すると全員
        required: false
        schema:
          type: string
          default: ""
        example: taro
      - name: page
        in: query
        description: ページ番号(0 から)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      responses:
        "200":
          description: ユーザーの一覧(ページ番号の方式)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 管理者以外が呼んだ(存在しない URL と同じ応答)・対象が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/users/{id}/suspension:
    put:
      tags:
      - 管理者(ユーザー)
      summary: ユーザーの利用停止・解除
      description: 利用停止にすると、そのユーザーのセッションをすべて消し(すぐにログアウトされる)、リアルタイム配信の接続も切る。投稿は、一覧に出なくなる。自分自身と、他の管理者は停止できない。操作は、いつ・誰が・何をしたかをログに残す
      operationId: suspend
      parameters:
      - name: id
        in: path
        description: ユーザーの ID(ユーザーID ではなく、数字の ID)
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspensionRequest"
        required: true
      responses:
        "200":
          description: 変えた。更新後のユーザーを返す
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: '`suspended` がない、または自分自身・管理者を停止しようとした'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ユーザーが見つからない(管理者以外が呼んだときも 404)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 権限がない、または CSRF の値(ヘッダー `X-XSRF-TOKEN`)がない・違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/config:
    get:
      tags:
      - アカウント
      summary: 画面の設定の取得
      description: Google ログインとお試しログインが使えるかを返す。ログイン不要。画面は最初にこれを呼ぶ。このとき、CSRF 対策の Cookie
        `XSRF-TOKEN` も受け取れる(データを変える API を呼ぶときに、この値をヘッダー `X-XSRF-TOKEN` に入れて送る)
      operationId: config
      responses:
        "200":
          description: 画面の設定(Google ログインが使えるか)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
      security: []
  /api/auth/guest:
    post:
      tags:
      - アカウント
      summary: お試しログイン
      description: 登録せずに、お試し用のアカウント(みんなで使う 1 つのアカウント)でログインし、Cookie `SESSION` を返す。アカウントがなければ作る。お試し用のアカウントは、プロフィールを変えられず、管理者の機能も使えない。書き込み(投稿・いいね・フォローなど)は、毎日
        4 時(日本時間)に消える
      operationId: guest
      responses:
        "200":
          description: ログインした。ユーザーの情報を返す(`guest` が `true`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "404":
          description: お試しログインを止めている(設定 `GUEST_LOGIN_ENABLED=false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/auth/login:
    post:
      tags:
      - アカウント
      summary: ログイン
      description: メールアドレスとパスワードでログインし、Cookie `SESSION` を返す(最後の操作から 30 日有効)。失敗のときは、メールアドレスとパスワードのどちらが違うかは教えない。同じメールアドレスで
        5 回続けて失敗すると、15 分間ロックする
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
        required: true
      responses:
        "200":
          description: ログインした。ユーザーの情報を返す
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: メールアドレスまたはパスワードが違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: メールアドレスの確認が済んでいない、または利用停止中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "423":
          description: ログインの失敗が続いたため、15 分間ログインできない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/auth/logout:
    post:
      tags:
      - アカウント
      summary: ログアウト
      description: セッションを消す(リアルタイム配信の接続も切れる)。ログインしていなくても、エラーにはならない
      operationId: logout
      responses:
        "204":
          description: ログアウトした
      security: []
  /api/auth/me:
    get:
      tags:
      - アカウント
      summary: ログイン中のユーザーの取得
      description: ログイン中のユーザーの情報と、未読の通知の数を返す。画面は最初にこれを呼び、401 ならログイン画面へ、初期設定前(`onboarded`
        が `false`)なら初期設定の画面へ移す
      operationId: me
      responses:
        "200":
          description: ログイン中のユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/password-reset:
    post:
      tags:
      - アカウント
      summary: パスワード再設定メールの送信
      description: 再設定用のリンクをメールで送る(1 時間有効、1 回だけ使える)。登録の有無にかかわらず同じ応答を返す。Google だけで登録した(パスワードを持たない)ユーザーには送らない
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOnly"
        required: true
      responses:
        "204":
          description: 受け付けた(送ったかどうかは教えない)
      security: []
  /api/auth/password-reset/confirm:
    post:
      tags:
      - アカウント
      summary: 新しいパスワードの設定
      description: 再設定メールのリンクの `token` と、新しいパスワード(8〜72 文字)を送る。変えると、そのユーザーの、この操作をした端末以外のセッションをすべて消す
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPassword"
        required: true
      responses:
        "204":
          description: パスワードを変えた
        "400":
          description: リンクが期限切れか、すでに使われている。またはパスワードが 8〜72 文字でない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/auth/signup:
    post:
      tags:
      - アカウント
      summary: メールアドレスで登録
      description: メールアドレスとパスワードで、「確認前」のユーザーを作り、確認用のリンクをメールで送る(リンクは 24 時間有効で、1 回だけ使える)。メールアドレスは小文字にして保存し、パスワードは
        BCrypt で変換して保存する。確認前のまま 24 時間たったユーザーは、同じメールアドレスで登録し直せる
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signup"
        required: true
      responses:
        "201":
          description: 登録した。確認メールを送った
        "400":
          description: 入力が正しくない(メールアドレスの形・254 文字以内、パスワードは 8〜72 文字)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 登録済みのメールアドレス
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: メールを送れなかった(しばらくしてからもう一度)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/auth/verify-email:
    post:
      tags:
      - アカウント
      summary: メールアドレスの確認
      description: 確認メールのリンクの `token` を送る。正しければ「確認済み」にして、そのままログイン状態にする(Cookie `SESSION`
        を返す)。ログインしたユーザーの情報を返す。初期設定前は `onboarded` が `false`
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Token"
        required: true
      responses:
        "200":
          description: 確認できた。ログイン状態になった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: リンクが正しくない・期限切れ・すでに使われている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/auth/verify-email/resend:
    post:
      tags:
      - アカウント
      summary: 確認メールの再送
      description: 確認前のユーザーに、確認メールをもう一度送る。登録の有無にかかわらず同じ応答を返す(登録済みかどうかを知られないため)。同じメールアドレスへは、1
        分に 1 回まで
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOnly"
        required: true
      responses:
        "204":
          description: 受け付けた(送ったかどうかは教えない)
        "429":
          description: 短い間に繰り返した(1 分に 1 回まで)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/bookmarks:
    get:
      tags:
      - いいね・ブックマーク
      summary: ブックマークの一覧
      description: 自分のブックマークを、**ブックマークした新しい順**に返す(他人のブックマークを見る API はない)。見えなくなった投稿(削除・非表示・ブロックなど)は、一覧に出さない(ブックマーク自体は残る)。続きは、前の結果の
        `nextCursor` を `before` に渡して取る
      operationId: bookmarks
      parameters:
      - name: before
        in: query
        description: 続きの読み込み。前の結果の `nextCursor`
        required: false
        schema:
          type: integer
          format: int64
        example: 1234
      - name: limit
        in: query
        description: 件数(1〜50。省略すると 20)
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 投稿の一覧。`nextCursor` が `null` なら、それ以上はない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/handles/{handle}/availability:
    get:
      tags:
      - アカウント
      summary: ユーザーIDが使えるかの確認
      description: 入力中のユーザーIDが使えるか(形・使えない語・重複)を確かめる。画面の初期設定で、入力のたびに呼ぶ
      operationId: availability
      parameters:
      - name: handle
        in: path
        description: 確かめるユーザーID(`@` は付けない)
        required: true
        schema:
          type: string
        example: taro_dev
      responses:
        "200":
          description: 使えるか(`available`)と、画面に出せる文(`message`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/me/avatar:
    put:
      tags:
      - プロフィール編集
      summary: アイコン画像の変更
      description: アイコン画像を変える。古い画像ファイルは消す。正方形には切り取らず、画面で丸く表示する
      operationId: changeAvatar

        required: false
        schema:
          type: integer
          format: int64
        example: 1234
      - name: limit
        in: query
        description: 件数(1〜50。省略すると 20)
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 投稿の一覧。`nextCursor` が `null` なら、それ以上はない(そのタグの投稿がなくても、空の一覧を返す)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/timeline:
    get:
      tags:
      - 投稿・タイムライン
      summary: タイムライン
      description: |-
        返信以外の投稿を、新しい順に返す。`tab=all` は全ユーザー、`tab=following` は自分とフォロー中のユーザーの投稿。削除・非表示の投稿、利用停止中のユーザーと、ブロック・ミュートの関係にある人の投稿は出ない。続きは、前の結果の `nextCursor` を `before` に渡して取る。

        `after` を渡すと、それより新しい投稿を**古い順**に最大 50 件返す(リアルタイム配信が切れていた間の、新着の取り込み用)
      operationId: timeline
      parameters:
      - name: tab
        in: query
        description: '`all`(すべて)か `following`(フォロー中)'
        required: false
        schema:
          type: string
          default: all
          enum:
          - all
          - following
      - name: before
        in: query
        description: 続きの読み込み。前の結果の `nextCursor`(この ID より古い投稿を取る)
        required: false
        schema:
          type: integer
          format: int64
        example: 1234
      - name: after
        in: query
        description: 新着の取り込み。この ID より新しい投稿を、古い順に返す(`before` より優先)
        required: false
        schema:
          type: integer
          format: int64
        example: 1300
      - name: limit
        in: query
        description: 件数(1〜50。省略すると 20)
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 投稿の一覧。`nextCursor` が `null` なら、それ以上はない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          description: '`tab` の値が正しくない'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

          format: int64
        example: 130
      - name: limit
        in: query
        description: 件数(1〜50。省略すると 20)
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 返信の一覧。`nextCursor` が `null` なら、それ以上はない
          content:
            application/json:

                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/users/{handle}/mute:
    put:
      tags:
      - ユーザー
      summary: ミュート
      description: ユーザーをミュートする。その人の投稿が、自分のタイムライン・検索・タグ・ブックマークなどの一覧に出なくなり、その人からの通知も作られなくなる。相手には何も知らされない。何度送っても同じ結果
      operationId: mute
      parameters:
      - name: handle
        in: path
        description: ユーザーID(`@` の後ろ。大文字・小文字は区別しない)
        required: true
        schema:
          type: string
        example: hanako
      responses:
        "204":
          description: ミュートした
        "400":
          description: 自分自身はミュートできない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ユーザーが存在しない、利用停止中、または相手が自分をブロックしている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 権限がない、または CSRF の値(ヘッダー `X-XSRF-TOKEN`)がない・違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - ユーザー
      summary: ミュートの解除
      description: ミュートを解除する。何度送っても同じ結果
      operationId: unmute
      parameters:
      - name: handle
        in: path
        description: ユーザーID(`@` の後ろ。大文字・小文字は区別しない)
        required: true
        schema:
          type: string
        example: hanako
      responses:
        "204":
          description: 解除した(ミュートしていなくても、エラーにしない)
        "404":
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 権限がない、または CSRF の値(ヘッダー `X-XSRF-TOKEN`)がない・違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/users/{handle}/posts:
    get:
      tags:
      - ユーザー
      summary: ユーザーの投稿の一覧
      description: "そのユーザーの投稿を、新しい順に返す。続きは、前の結果の `nextCursor` を `before` に渡して取る。ミュ\
        ートした人の投稿も、プロフィールを自分で開いたものなので返す。管理者に非表示にされた投稿は、本人が見るときだけ(`hidden: true` の印つ\
        きで)含まれる。自分がブロックしている相手の一覧は、空で返す"
      operationId: posts
      parameters:
      - name: handle
        in: path
        description: ユーザーID(`@` の後ろ。大文字・小文字は区別しない)
        required: true
        schema:
          type: string
        example: taro_dev
      - name: tab
        in: query
        description: '`posts`(返信以外)・`replies`(返信を含むすべて)・`media`(画像付き。返信を含む)'
        required: false
        schema:
          type: string
          default: posts
          enum:
          - posts
          - replies
          - media
      - name: before
        in: query
        description: 続きの読み込み。前の結果の `nextCursor`
        required: false
        schema:
          type: integer
          format: int64
        example: 1234
      - name: limit
        in: query
        description: 件数(1〜50。省略すると 20)
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 投稿の一覧。`nextCursor` が `null` なら、それ以上はない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          description: '`tab` の値が正しくない'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ユーザーが存在しない、利用停止中、または相手が自分をブロックしている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media/**:
    get:
      tags:
      - 画像
      summary: 画像の取得
      description: 投稿・アイコン・ヘッダーの画像を返す。URL は、投稿やプロフィールの `url`・`avatarUrl`・`headerUrl`
        に入っている形(`/media/posts/2026/11/〈推測できない名前〉.webp` など)で、ほかの API の応答から取り出して使う。**ログイン中の人だけが取れる**(バケットは公開せず、サーバーが中継する)。ファイル名は推測できず、中身も変わらないので、ブラウザには
        30 日覚えてもらう(本人のブラウザだけ)
      operationId: get_1
      responses:
        "200":
          description: 画像のファイル(JPEG・PNG・WebP・GIF)
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "404":
          description: 画像が見つからない(保存場所の外を指す URL を含む)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    AdminPost:
      type: object
      description: 管理者の画面に出す、投稿 1 件分
      properties:
        id:
          type: integer
          format: int64
          description: 投稿の ID
          example: 1234
        authorId:
          type: integer
          format: int64
          description: 投稿者のユーザーの ID
          example: 7
        authorHandle:
          type:
          - string
          - "null"
          description: 投稿者のユーザーID(`@` の後ろ)。初期設定の前は `null`
          example: taro_dev
        text:
          type: string
          description: 本文
          example: "新しいカフェを見つけました #カフェ巡り"
        createdAt:
          type: string
          format: date-time
          description: 投稿した日時(UTC)
          example: 2026-11-01T03:15:00Z
        hidden:
          type: boolean
          description: 管理者に非表示にされているか
          example: false
        authorSuspended:
          type: boolean
          description: 投稿者が利用停止中か
          example: false
        reply:
          type: boolean
          description: 返信か
          example: false
    AdminPostPage:
      type: object
      description: 投稿の一覧の 1 ページ(ページ番号の方式。ページ番号は 0 から)
      properties:
        items:
          type: array
          description: 投稿(新しい順。50 件ずつ)
          items:
            $ref: "#/components/schemas/AdminPost"
        page:
          type: integer
          format: int32
          description: このページの番号(0 から)
          example: 0
        totalPages:
          type: integer
          format: int32
          description: ページの数
          example: 3
        total:
          type: integer
          format: int64
          description: 条件に合う投稿の総数
          example: 120
    AdminUserPage:
      type: object
      description: ユーザーの一覧の 1 ページ(ページ番号の方式。ページ番号は 0 から)
      properties:
        items:
          type: array
          description: ユーザー(登録の新しい順。50 件ずつ)
          items:
            $ref: "#/components/schemas/AdminUserResponse"
        page:
          type: integer
          format: int32
          description: このページの番号(0 から)
          example: 0
        totalPages:
          type: integer
          format: int32
          description: ページの数
          example: 3
        total:
          type: integer
          format: int64
          description: 条件に合うユーザーの総数
          example: 120
    AdminUserResponse:
      type: object
      description: 管理者の画面に出す、ユーザー 1 人分
      properties:
        id:
          type: integer
          format: int64
          description: ユーザーの ID
          example: 7
        handle:
          type:
          - string
          - "null"
          description: ユーザーID(`@` の後ろ)。初期設定の前は `null`
          example: taro_dev
        displayName:
          type:
          - string
          - "null"
          description: 表示名。初期設定の前は `null`
          example: たろう
        email:
          type: string
          description: メールアドレス
          example: taro@example.com
        role:
          type: string
          description: 権限。`USER`(一般)か `ADMIN`(管理者)
          enum:
          - USER
          - ADMIN
          example: USER
        suspended:
          type: boolean
          description: 利用停止中か
          example: false
        postCount:
          type: integer
          format: int64
          description: 投稿の数(返信を含む。削除したものは数えない)
          example: 85
        createdAt:
          type: string
          format: date-time
          description: 登録した日時(UTC)
          example: 2026-10-25T05:00:00Z
    ApiError:
      type: object
      description: エラーのときに返す JSON。`message` は、そのまま画面に出せる日本語
      properties:
        message:
          type: string
          description: エラーの内容(画面にそのまま出せる日本語)
          example: 入力内容に誤りがあります
        errors:
          type: array
          description: 入力チェックのエラーの一覧。入力チェックのとき以外は、空の配列
          items:
            $ref: "#/components/schemas/FieldProblem"
    AvailabilityResponse:
      type: object
      description: ユーザーIDが使えるかの結果
      properties:
        available:
          type: boolean
          description: 使えるか
          example: true
        message:
          type: string
          description: 画面にそのまま出せる文。使えるときは「使えます」、使えないときは理由
          example: 使えます
    BookmarkResult:
      type: object
      description: ブックマークの結果
      properties:
        bookmarked:
          type: boolean
          description: 自分がブックマークしているか
          example: true
    ConfigResponse:
      type: object
      description: 画面の設定
      properties:
        googleEnabled:
          type: boolean
          description: Google ログインが使えるか。`false` のときは、画面に「Google でログイン」を出さない
          example: true
        guestEnabled:
          type: boolean
          description: お試しログイン(`POST /api/auth/guest`)が使えるか。`false` のときは、画面に「登録せずに試す」を出さない
          example: true
    EditRequest:
      type: object
      description: 投稿の編集に送る内容
      properties:
        text:
          type: string
          description: 新しい本文(1000 文字以内。画像がない投稿は、空にできない)
          example: "書き直しました #SpringBoot"
    EmailOnly:
      type: object
      description: メールアドレスだけを送る内容(確認メールの再送・パスワード再設定メールの送信)
      properties:
        email:
          type: string
          description: メールアドレス
          example: taro@example.com
          minLength: 1
      required:
      - email
    FieldProblem:
      type: object
      description: 入力チェックのエラー 1 件
      properties:
        field:
          type: string
          description: エラーになった項目の名前
          example: text
        message:
          type: string
          description: その項目のエラーの内容
          example: 1000文字以内で入力してください
    FollowResult:
      type: object
      description: フォローの結果
      properties:
        following:
          type: boolean
          description: 自分がフォローしているか
          example: true
        followerCount:
          type: integer
          format: int64
          description: 相手のフォロワーの数(この操作のあと)
          example: 31
    ImageForm:
      type: object
      description: 画像の変更に送る内容(`multipart/form-data`)
      properties:
        file:
          type: string
          format: binary
          description: 画像ファイル(5MB まで。JPEG・PNG・WebP・GIF。形式は拡張子ではなく中身で確かめる)
    LikeResult:
      type: object
      description: いいねの結果
      properties:
        liked:
          type: boolean
          description: 自分がいいねしているか
          example: true
        likeCount:
          type: integer
          format: int64
          description: いいねの数(この操作のあと)
          example: 6
    Login:
      type: object
      description: ログインに送る内容
      properties:
        email:
          type: string
          description: メールアドレス
          example: taro@example.com
          minLength: 1
        password:
          type: string
          format: password
          description: パスワード
          example: example-pass-123
          minLength: 1
      required:
      - email
      - password
    MeResponse:
      type: object
      description: ログイン中のユーザー。初期設定の前は `handle`・`displayName` が `null`、`onboarded`
        が `false`
      properties:
        id:
          type: integer
          format: int64
          description: ユーザーの ID(1 から増えていく整数)
          example: 7
        email:
          type: string
          description: メールアドレス(小文字)
          example: taro@example.com
        handle:
          type:
          - string
          - "null"
          description: ユーザーID(`@` の後ろ)。初期設定の前は `null`
          example: taro_dev
        displayName:
          type:
          - string
          - "null"
          description: 表示名。初期設定の前は `null`
          example: たろう
        avatarUrl:
          type:
          - string
          - "null"
          description: アイコン画像の URL(`/media/…`)。ないときは `null`
          example: /media/avatars/3f9c1a7e-0b1d-4c55-9e0a-2b6f4c7d8e91.webp
        role:
          type: string
          description: 権限。`USER`(一般)か `ADMIN`(管理者)
          enum:
          - USER
          - ADMIN
          example: USER
        onboarded:
          type: boolean
          description: 初期設定(ユーザーIDと表示名の決定)が済んでいるか
          example: true
        unreadNotificationCount:
          type: integer
          format: int64
          description: 未読の通知の数
          example: 3
        guest:
          type: boolean
          description: お試しログインのアカウントか(`true` なら、プロフィールを変えられず、書き込みは毎日消える)
          example: false
    NewPassword:
      type: object
      description: 新しいパスワードを送る内容
      properties:
        token:
          type: string
          description: 再設定メールのリンク(`?token=…`)の値
          example: k3Jx0b...(推測できない長い文字列)
          minLength: 1
        password:
          type: string
          format: password
          description: 新しいパスワード(8〜72 文字)
          example: example-new-pass-456
      required:
      - password
      - token
    NotificationActor:
      type: object
      description: 通知の、操作した人
      properties:
        id:
          type: integer
          format: int64
          description: ユーザーの ID
          example: 9
        handle:
          type: string
          description: ユーザーID(`@` の後ろ)
          example: hanako
        displayName:
          type: string
          description: 表示名
          example: はなこ
        avatarUrl:
          type:
          - string
          - "null"
          description: アイコン画像の URL(`/media/…`)。ないときは `null`
    NotificationPage:
      type: object
      description: 通知の一覧の 1 ページ
      properties:
        items:
          type: array
          description: 通知(新しい順)
          items:
            $ref: "#/components/schemas/NotificationResponse"
        nextCursor:
          type:
          - integer
          - "null"
          format: int64
          description: 続きを読み込むときに、`before` に渡す値。`null` なら、それ以上はない
          example: 480
    NotificationPost:
      type: object
      description: 通知の対象の投稿の、短い紹介
      properties:
        id:
          type: integer
          format: int64
          description: 投稿の ID。押すと、その投稿の詳細へ移る
          example: 1234
        textPreview:
          type: string
          description: 本文の先頭 40 文字
          example: "今日は #SpringBoot の勉強を…"
    NotificationResponse:
      type: object
      description: 通知。リアルタイム配信(SSE)の `notification` イベントでも、同じ形で届く
      properties:
        id:
          type: integer
          format: int64
          description: 通知の ID(大きいほど新しい)
          example: 501
        type:
          type: string
          description: 種類。`LIKE`(いいねされた)・`REPLY`(返信された)・`FOLLOW`(フォローされた)・`MENTION`(メンションされた)
          enum:
          - LIKE
          - REPLY
          - FOLLOW
          - MENTION
          example: LIKE
        actor:
          $ref: "#/components/schemas/NotificationActor"
          description: 操作した人
        post:
          type: "null"
          $ref: "#/components/schemas/NotificationPost"
          description: 対象の投稿。`FOLLOW` のときは `null`
        read:
          type: boolean
          description: 既読か
          example: false
        createdAt:
          type: string
          format: date-time
          description: 通知ができた日時(UTC)
          example: 2026-11-01T03:20:00Z
    Onboarding:
      type: object
      description: 初期設定に送る内容
      properties:
        handle:
          type: string
          description: ユーザーID。半角英数字と `_` の 3〜15 文字。大文字・小文字は区別せずに重複を確かめる(表示は入力したとおり)。あとから変えられない
          example: taro_dev
        displayName:
          type: string
          description: 表示名(1〜50 文字)
          example: たろう
          maxLength: 50
          minLength: 0
      required:
      - displayName
      - handle
    PostAuthor:
      type: object
      description: 投稿者
      properties:
        id:
          type: integer
          format: int64
          description: ユーザーの ID
          example: 7
        handle:
          type: string
          description: ユーザーID(`@` の後ろ)
          example: taro_dev
        displayName:
          type: string
          description: 表示名
          example: たろう
        avatarUrl:
          type:
          - string
          - "null"
          description: アイコン画像の URL(`/media/…`)。ないときは `null`
          example: /media/avatars/3f9c1a7e-0b1d-4c55-9e0a-2b6f4c7d8e91.webp
    PostForm:
      type: object
      description: 投稿・返信の作成に送る内容(`multipart/form-data`)
      properties:
        text:
          type: string
          description: 本文(1000 文字以内)。画像がないときは必須
          example: "新しいカフェを見つけました #カフェ巡り"
        replyToId:
          type:
          - integer
          - "null"
          format: int64
          description: 返信先の投稿の ID。返信のときだけ送る
          example: 123
        images:
          type: array
          description: 画像ファイル(0〜10 枚。1 枚 5MB まで。JPEG・PNG・WebP・GIF。形式は拡張子ではなく中身で確かめる)
          items:
            type: string
            format: binary
          maxItems: 10
        alts:
          type: array
          description: "画像ごとの代替テキスト(1 つ 1000 文字以内。空でもよい)。`images` と同じ順番・同じ数で送る。「,」\
            を含んでも分かれず、送られたとおりに受け取る"
          items:
            type: string
    PostImage:
      type: object
      description: 投稿の画像
      properties:
        url:
          type: string
          description: 画像の URL(`/media/…`。ログイン中の人だけが取れる)
          example: /media/posts/2026/11/a1b2c3d4-0b1d-4c55-9e0a-2b6f4c7d8e91.webp
        alt:
          type: string
          description: 代替テキスト(読み上げ用の説明)。ないときは空文字
          example: ノートパソコンの画面
        width:
          type: integer
          format: int32
          description: 画像の幅(ピクセル)
          example: 1600
        height:
          type: integer
          format: int32
          description: 画像の高さ(ピクセル)
          example: 1200
    PostPage:
      type: object
      description: 投稿の一覧の 1 ページ
      properties:
        items:
          type: array
          description: 投稿(この API の並び順どおり)
          items:
            $ref: "#/components/schemas/PostResponse"
        nextCursor:
          type:
          - integer
          - "null"
          format: int64
          description: 続きを読み込むときに、`before`(古い順の一覧では `after`)に渡す値。`null` なら、それ以上はない
          example: 1214
    PostReplyTo:
      type: object
      description: 返信先
      properties:
        id:
          type: integer
          format: int64
          description: 返信先の投稿の ID
          example: 1200
        authorHandle:
          type:
          - string
          - "null"
          description: 返信先の投稿者のユーザーID。返信先が見られないときは `null`
          example: hanako
        unavailable:
          type: boolean
          description: 返信先が見られない(削除・非表示など)か。`true` のとき、画面には「削除された投稿への返信」と出す
          example: false
    PostResponse:
      type: object
      description: 投稿。投稿を返す API は、すべてこの形を使う。見られない投稿(削除・非表示・投稿者が利用停止中)は、`unavailable`
        が `true` で、`id` 以外が空になる
      properties:
        id:
          type: integer
          format: int64
          description: 投稿の ID(1 から増えていく整数。大きいほど新しい)
          example: 1234
        author:
          type: "null"
          $ref: "#/components/schemas/PostAuthor"
          description: 投稿者。見られない投稿では `null`
        text:
          type: string
          description: 本文(改行を含む)。画像だけの投稿は空文字。ハッシュタグ・メンション・URL の抜き出しは、画面が行う
          example: "新しいカフェを見つけました #カフェ巡り @hanako"
        images:
          type: array
          description: 画像(0〜10 枚。投稿した順)
          items:
            $ref: "#/components/schemas/PostImage"
        replyTo:
          type: "null"
          $ref: "#/components/schemas/PostReplyTo"
          description: 返信のときの、返信先。返信でなければ `null`
        likeCount:
          type: integer
          format: int64
          description: いいねの数
          example: 5
        replyCount:
          type: integer
          format: int64
          description: 返信の数(見えない返信は数えない)
          example: 2
        likedByMe:
          type: boolean
          description: 自分がいいねしているか
          example: false
        bookmarkedByMe:
          type: boolean
          description: 自分がブックマークしているか
          example: false
        mine:
          type: boolean
          description: 自分の投稿か(編集・削除のメニューを出すかの判断に使う)
          example: false
        hidden:
          type: boolean
          description: 管理者に非表示にされているか。`true` の投稿が見えるのは、投稿者本人のプロフィールだけ
          example: false
        createdAt:
          type:
          - string
          - "null"
          format: date-time
          description: 投稿した日時(UTC。ISO 8601)
          example: 2026-11-01T03:15:00Z
        editedAt:
          type:
          - string
          - "null"
          format: date-time
          description: 最後に編集した日時(UTC)。編集していなければ `null`
          example: 2026-11-01T03:20:00Z
        unavailable:
          type: boolean
          description: 見られない投稿か(削除・管理者による非表示・投稿者の利用停止)。`true` のときは、`id` 以外は空
          example: false
    ProfileRequest:
      type: object
      description: プロフィールの更新に送る内容
      properties:
        displayName:
          type: string
          description: 表示名(必須。1〜50 文字。前後の空白は取り除く)
          example: たろう
        bio:
          type:
          - string
          - "null"
          description: 自己紹介(160 文字以内。空にすると未設定になる)
          example: Java を勉強中です
    ProfileResponse:
      type: object
      description: プロフィール
      properties:
        id:
          type: integer
          format: int64
          description: ユーザーの ID
          example: 7
        handle:
          type: string
          description: ユーザーID(`@` の後ろ)
          example: taro_dev
        displayName:
          type: string
          description: 表示名
          example: たろう
        bio:
          type:
          - string
          - "null"
          description: 自己紹介(160 文字以内)。未設定のときは `null`
          example: Java を勉強中です
        avatarUrl:
          type:
          - string
          - "null"
          description: アイコン画像の URL(`/media/…`)。ないときは `null`
          example: /media/avatars/3f9c1a7e-0b1d-4c55-9e0a-2b6f4c7d8e91.webp
        headerUrl:
          type:
          - string
          - "null"
          description: ヘッダー画像の URL(`/media/…`)。ないときは `null`
        followingCount:
          type: integer
          format: int64
          description: フォローしている人の数
          example: 12
        followerCount:
          type: integer
          format: int64
          description: フォロワーの数
          example: 30
        postCount:
          type: integer
          format: int64
          description: 投稿の数(返信を含む。削除したものは数えない)
          example: 85
        joinedAt:
          type: string
          format: date-time
          description: 登録した日時(UTC)
          example: 2026-10-25T05:00:00Z
        followedByMe:
          type: boolean
          description: 自分がフォローしているか
          example: false
        followsMe:
          type: boolean
          description: 相手が自分をフォローしているか
          example: true
        blockedByMe:
          type: boolean
          description: 自分がブロックしているか
          example: false
        mutedByMe:
          type: boolean
          description: 自分がミュートしているか
          example: false
        me:
          type: boolean
          description: 自分自身のプロフィールか
          example: false
    ReadRequest:
      type: object
      description: 既読にする範囲
      properties:
        upToId:
          type: integer
          format: int64
          description: この ID 以下の、自分の通知を、すべて既読にする(通知の一覧の先頭の `id` を送る)
          example: 501
      required:
      - upToId
    Signup:
      type: object
      description: 登録に送る内容
      properties:
        email:
          type: string
          format: email
          description: メールアドレス(254 文字以内。大文字・小文字は区別しない)
          example: taro@example.com
          maxLength: 254
          minLength: 0
        password:
          type: string
          format: password
          description: パスワード(8〜72 文字)
          example: example-pass-123
      required:
      - email
      - password
    SuspensionRequest:
      type: object
      description: 利用停止・解除に送る内容
      properties:
        suspended:
          type: boolean
          description: '`true` で利用停止にする、`false` で解除する'
          example: true
      required:
      - suspended
    TagCount:
      type: object
      description: ハッシュタグと、使われた投稿の数
      properties:
        name:
          type: string
          description: タグの名前(`#` なし。小文字・全角を半角にそろえた形)
          example: springboot
        postCount:
          type: integer
          format: int64
          description: 使われた投稿の数(トレンドでは直近 24 時間の数)
          example: 12
    TagResults:
      type: object
      description: ハッシュタグの検索結果
      properties:
        items:
          type: array
          description: ハッシュタグ(最大 20 件)
          items:
            $ref: "#/components/schemas/TagCount"
    Token:
      type: object
      description: メールのリンクの値を送る内容(メールアドレスの確認)
      properties:
        token:
          type: string
          description: メールのリンク(`?token=…`)の値
          example: k3Jx0b...(推測できない長い文字列)
          minLength: 1
      required:
      - token
    Trends:
      type: object
      description: トレンド
      properties:
        tags:
          type: array
          description: 直近 24 時間によく使われたハッシュタグ(上位 10 件)
          items:
            $ref: "#/components/schemas/TagCount"
        popularPosts:
          type: array
          description: 直近 24 時間の人気投稿(いいねが 1 件以上の、返信以外の投稿。上位 10 件)
          items:
            $ref: "#/components/schemas/PostResponse"
    UnreadCount:
      type: object
      description: 未読の通知の数
      properties:
        unreadCount:
          type: integer
          format: int64
          description: 未読の通知の数
          example: 3
    UserPage:
      type: object
      description: ユーザーの一覧の 1 ページ
      properties:
        items:
          type: array
          description: ユーザー(この API の並び順どおり)
          items:
            $ref: "#/components/schemas/UserSummary"
        nextCursor:
          type:
          - integer
          - "null"
          format: int64
          description: 続きを読み込むときに、`before` に渡す値。`null` なら、それ以上はない
          example: 40
    UserResults:
      type: object
      description: ユーザーの検索結果
      properties:
        items:
          type: array
          description: ユーザー(最大 20 件)
          items:
            $ref: "#/components/schemas/UserSummary"
    UserSummary:
      type: object
      description: 一覧用のユーザー(検索結果・フォロー中・フォロワー・ブロック・ミュートの一覧など)
      properties:
        id:
          type: integer
          format: int64
          description: ユーザーの ID
          example: 9
        handle:
          type: string
          description: ユーザーID(`@` の後ろ)
          example: hanako
        displayName:
          type: string
          description: 表示名
          example: はなこ
        avatarUrl:
          type:
          - string
          - "null"
          description: アイコン画像の URL(`/media/…`)。ないときは `null`
        bio:
          type:
          - string
          - "null"
          description: 自己紹介。未設定のときは `null`
          example: Web デザインとカフェめぐりが好きです
        followedByMe:
          type: boolean
          description: 自分がフォローしているか
          example: true
        followsMe:
          type: boolean
          description: 相手が自分をフォローしているか
          example: false
    VisibilityRequest:
      type: object
      description: 非表示・解除に送る内容
      properties:
        hidden:
          type: boolean
          description: '`true` で非表示にする、`false` で表示に戻す'
          example: true
      required:
      - hidden
  securitySchemes:
    sessionCookie:
      type: apiKey
      description: ログイン(`POST /api/auth/login` か Google ログイン)でサーバーが渡す Cookie。ブラウザが自動で付けるので、この画面の「Authorize」では設定できない。先にアプリでログインしておく
      name: SESSION
      in: cookie

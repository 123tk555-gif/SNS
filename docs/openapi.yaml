        "404":
          description: 元の投稿が見つからない(削除・非表示・ブロックで見えないものを含む)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/search/posts:
    get:
      tags:
      - 検索・トレンド
      summary: 投稿の検索
      description: 投稿の本文(返信を含む)を、部分一致で探す。空白(全角・半角)で区切ると、すべての言葉を含むものを探す(最初の 10 語まで)。日本語の文章も、そのまま文字の並びとして探せる。`%`
        と `_` は、ふつうの文字として探す。新しい順に返す。続きは、前の結果の `nextCursor` を `before` に渡して取る。削除・非表示の投稿、利用停止中のユーザーと、ブロック・ミュートの関係にある人の投稿は出ない
      operationId: searchPosts
      parameters:
      - name: q
        in: query
        description: 検索する言葉。前後の空白を取り除いて 1〜100 文字。大文字・小文字、全角・半角の英数字は区別しない
        required: false
        schema:
          type: string
          default: ""
        example: カフェ 勉強
      - name: before
        in: query
        description: 続きの読み込み。前の結果の `nextCursor`
        required: false
        schema:
          type: integer
          format: int64
        example: 1234
      - name: limit
        in: query
        description: 件数(1〜50。省略すると 20)
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 投稿の一覧。`nextCursor` が `null` なら、それ以上はない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          description: 検索する言葉が空、または 100 文字を超える
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

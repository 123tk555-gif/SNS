  /api/stream:
    get:
      tags:
      - リアルタイム配信(SSE)
      summary: リアルタイム配信につなぐ(SSE)
      description: |-
        ログイン後に、ブラウザの `new EventSource('/api/stream')` でつなぎ、ログイン中はつなぎっぱなしにする。新しい投稿・削除された投稿・通知が、再読み込みなしで届く。

        | イベント名 | いつ | 送る相手 | 中身 |
        |---|---|---|---|
        | `post-created` | 返信以外の投稿が作られた | 接続中の全員(見えない人と、投稿者本人を除く) | 投稿(`PostResponse`)と、投稿者を自分がフォローしているか(`followedByMe`) |
        | `post-deleted` | 投稿が削除・非表示にされた | 接続中の全員 | `{"id": 1234}` |
        | `notification` | 通知が作られた | 受け取る人 | `{"unreadCount": 4, "notification": {…通知…}}` |

        1 人が複数のタブで開いてもよい(1 人 5 接続まで。超えたら、古いものから切る)。切れたら、ブラウザが自動でつなぎ直す(つなぎ直したときの取りこぼしは、`GET /api/timeline?after=` と `GET /api/notifications/unread-count` で取る)。**この画面の「Try it out」では、つなぎっぱなしになるため、動きを確かめられない**
      operationId: stream
      responses:
        "200":
          description: つなぎっぱなしのイベントの流れ(`text/event-stream`)
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                event:post-deleted
                data:{"id":1234}

        "401":
          description: ログインしていない(セッションがない・切れた)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/tags/{name}/posts:
    get:
      tags:
      - 検索・トレンド
      summary: ハッシュタグの投稿の一覧
      description: そのハッシュタグを含む投稿(返信を含む)を、新しい順に返す。続きは、前の結果の `nextCursor` を `before`
        に渡して取る。ハッシュタグは、大文字・小文字、全角・半角を区別しない
      operationId: tagPosts
      parameters:
      - name: name
        in: path
        description: ハッシュタグの名前(`#` は付けない)
        required: true
        schema:
          type: string
        example: springboot

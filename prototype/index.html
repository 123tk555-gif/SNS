<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNSタイムライン プロトタイプ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    SNSタイムラインアプリの見た目と操作を確かめるためのプロトタイプ。
    HTML・CSS・JavaScript だけで動く(サーバー不要)。このファイルをブラウザで開けば使える。
    データはブラウザのメモリの中だけにあり、ページを読み込み直すと最初の状態に戻る。
  -->
  <a class="skip-link" href="#main">本文へ移動</a>
  <div class="proto-bar">プロトタイプです。データは保存されず、ページを読み込み直すと最初に戻ります。</div>
  <div id="app"></div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>

  <script src="app.js"></script>
</body>
</html>

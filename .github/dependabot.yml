# Dependabot: 使っている部品の新しい版と、既知の脆弱性を、週に 1 回確かめて PR を作る。
# PR にも CI が走るので、テストが通れば安心してマージできる。
# cooldown: 出たばかりの版は 14 日待ってから提案する(出た直後の版は、問題が見つかって取り下げられることがあるため)。
# 脆弱性の修正(セキュリティの更新)は、待たずにすぐ提案される。
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      e2e-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]

  # Dockerfile の土台のイメージ(node・maven・eclipse-temurin)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
